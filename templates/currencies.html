<html>
<head><title>Конвертер валют</title></head>
<body>
  <h1>Конвертер валют</h1>
  <form action="/exchange_rate" method="post">
    <label>З валюти:</label>
    <select name="from">$currencies</select>
    <br>
    <label>У валюту:</label>
    <select name="to">$currencies</select>
    <br>
    <label>Сума:</label>
    <input type="text" name="amount">
    <br>
    <input type="submit" value="Конвертувати">
  </form>
</body>
</html>
